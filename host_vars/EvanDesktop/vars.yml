# System vars
hostname: EvanDesktop
timezone: "America/Toronto"

# APT vars
apt_repositories:
  - "ppa:libretro/stable"
apt_packages:
  - libreoffice
  - pavucontrol
  - qbittorrent
  - solaar
  - steam
  - vlc

# User-level vars
username: ejackson
home_directory: "/home/ejackson"
user_shell: /usr/bin/fish
github_key_file: "/home/ejackson/.ssh/id_github_ed25519"
dotfiles_branch: personal

# .deb's
debs:
  vscode:
    url: "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
    filename: "/tmp/vscode.deb"
    package: "code"
  wireguird:
    url: "https://github.com/UnnoTed/wireguird/releases/download/v1.1.0/wireguird_amd64.deb"
    filename: "/tmp/wireguird.deb"
    package: "wireguird"
  filen:
    url: "http://cdn.filen.io/@filen/desktop/release/latest/Filen_linux_amd64.deb"
    filename: "/tmp/filen.deb"
    package: filen
  # TODO protonvpn requires a different process

# Flatpaks
flatpaks:
  - io.gitlab.librewolf-community
  - tv.plex.PlexDesktop
  - com.spotify.Client
  - com.github.tchx84.Flatseal
  - org.libretro.RetroArch
  - org.DolphinEmu.dolphin-emu
  - net.pcsx2.PCSX2
  - com.brave.Browser
  - net.davidotek.pupgui2 # Proton-GE tool (https://davidotek.github.io/protonup-qt)
  - dev.lizardbyte.app.Sunshine

# Autostart
autostart_configs:
  filen:
    filename: "@filendesktop.desktop"
    script: |
      [Desktop Entry]
      Categories=Utility;
      Comment=Filen Desktop Client
      Exec="/opt/Filen/@filendesktop" %U
      Icon=@filendesktop
      Name=Filen
      StartupWMClass=Filen
      Terminal=false
      Type=Application
  wireguird:
    filename: "@wireguird.desktop"
    script: |
      [Desktop Entry]
      Categories=Utility;
      Comment=Wireguird
      Exec="/usr/local/bin/wireguird" %U
      Icon=@wireguird
      Name=Wireguird
      StartupWMClass=Wireguird
      Terminal=false
      Type=Application
  sunshine:
    filename: "dev.lizardbyte.app.Sunshine.desktop"
    script: |
      [Desktop Entry]
      Categories=Utility;
      Comment=Sunshine game stream host
      Exec=/usr/bin/flatpak run dev.lizardbyte.app.Sunshine
      Icon=dev.lizardbyte.app.Sunshine
      Name=Sunshine
      Terminal=false
      Type=Application

# Sunshine config
sunshine_display_output: HDMI-A-1
sunshine_default_mode: "3840x2160@60"
sunshine_steam_deck_mode: "1280x800@60"
sunshine_apps:
  - name: Desktop
    image-path: desktop.png
  - name: Steam
    image-path: steam.png
    output: ""
    cmd: ""
    detached:
      - "flatpak-spawn --host /usr/games/steam steam://open/bigpicture"
    prep-cmd:
      - do: "flatpak-spawn --host kscreen-doctor output.{{ sunshine_display_output }}.mode.{{ sunshine_steam_deck_mode }}"
        undo: "flatpak-spawn --host kscreen-doctor output.{{ sunshine_display_output }}.mode.{{ sunshine_default_mode }}"
    exclude-global-prep-cmd: false
    elevated: false
    auto-detach: true
    wait-all: true
    exit-timeout: 5

# Fonts
nerd_fonts_version: "v3.1.0"
fonts:
  ubuntu_mono:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/UbuntuMono.zip"
    filename: "/tmp/UbuntuMono.zip"

# No-login users for owning services
service_users:
  folding:
    name: "folding"
    uid: "1007"
    groups: "folding"
    gid: "1007"
