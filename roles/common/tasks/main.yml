- name: Reboot if required
  when: trigger_reboots is defined and trigger_reboots
  block:
    - name: Check for presence of reboot-required file
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
    - name: Reboot if required
      become: true
      when: reboot_required_file.stat.exists
      ansible.builtin.reboot:

- name: Add IP addresses of all hosts to all hosts
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    regexp: ".*{{ item }}$"
    line: "{{ hostvars[item].ansible_host }} {{item}}.local"
    state: present
  when: hostvars[item].ansible_host is defined
  with_items: "{{ groups.all }}"

- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configure Python
  ansible.builtin.include_tasks: python.yml
