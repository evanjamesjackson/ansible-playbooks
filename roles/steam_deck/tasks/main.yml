# SteamOS has a read-only root filesystem that is reset on updates, so packages
# can't be installed via pacman. curl, flatpak and vim ship with SteamOS.

- name: Ensure vi alias points to vim
  ansible.builtin.lineinfile:
    path: "{{ home_directory }}/.bashrc"
    line: "alias vi=vim"

- name: Configure Filen sync
  ansible.builtin.include_tasks: filen_sync.yml
