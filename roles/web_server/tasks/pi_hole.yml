- name: Pull Pi-hole Docker image
  community.docker.docker_image_pull:
    name: mpgirro/pihole-unbound

- name: Start Pi-hole Docker container
  community.docker.docker_container:
    name: pi-hole
    image: mpgirro/pihole-unbound
    restart_policy: unless-stopped
    ports:
      - "{{ pi_hole_web_port }}:{{ pi_hole_web_port }}/tcp"
      # Bind DNS to the LAN IP only so it doesn't conflict with the host's local resolver
      - "{{ ansible_default_ipv4.address }}:53:53/tcp"
      - "{{ ansible_default_ipv4.address }}:53:53/udp"
    env:
      TZ: "{{ timezone }}"
      # Web admin
      FTLCONF_webserver_api_password: "pihole"
      FTLCONF_webserver_port: "{{ pi_hole_web_port }}"
      # LAN clients arrive from outside the Docker bridge network, so default "LOCAL" mode would ignore them
      FTLCONF_dns_listeningMode: "ALL"
    volumes:
      - pihole-config:/etc/pihole

- name: Open Pi-hole web UI port in UFW
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ pi_hole_web_port }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ local_subnets }}"

- name: Open DNS port (TCP) in UFW
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    port: "53"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ local_subnets }}"

- name: Open DNS port (UDP) in UFW
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    port: "53"
    proto: udp
    src: "{{ item }}"
  loop: "{{ local_subnets }}"
